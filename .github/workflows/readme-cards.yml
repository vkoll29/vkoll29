name: Update README cards

# Renders the profile cards as SVG files in this repo, so the README does not
# depend on the public github-readme-stats server (paused as of Nov 2026).

on:
  schedule:
    - cron: "0 3 * * *" # daily, 06:00 EAT
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/readme-cards.yml]

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # README_STATS_TOKEN: optional PAT (classic: repo + read:user) so private
      # contributions count. Without it the card shows public stats only.
      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=algolia&show_icons=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=cobalt&layout=compact&langs_count=8&hide=html,css,scss
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
